# Lab engine settings (sourced by run_lab.sh). A value already set in your shell
# environment wins over the default here.

# Permission mode for headless phase runs.
: "${PERMISSION_MODE:=acceptEdits}"

# Tools pre-approved for headless runs, space-separated. Headless runs deny any
# tool not listed here or already allowed in your Claude Code settings.
# `mcp__<server>` allows every tool of that server. Empty = rely on your settings.
# Example:
#   ALLOWED_TOOLS="Bash WebSearch WebFetch mcp__sequential-thinking mcp__filesystem mcp__puppeteer"
: "${ALLOWED_TOOLS:=}"

# Any extra flags passed to `claude -p` (e.g. --model, --max-turns).
: "${CLAUDE_EXTRA_FLAGS:=}"

# Where `claude mcp add` writes: project (.mcp.json, shared) | local | user
: "${MCP_SCOPE:=project}"

# How many trailing transcript lines are searched for the PASSED gate line.
: "${GATE_TAIL_LINES:=15}"
