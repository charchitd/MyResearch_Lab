# MCP server registry — one server per line. `./run_lab.sh mcp` registers every
# line marked `on`; `./run_lab.sh mcp <name>` registers one regardless of state.
#
#   name | state | transport | env or headers | command or URL
#
#   state      on | off
#   transport  stdio | http
#   env        stdio: KEY=VALUE pairs separated by ';'   http: headers separated by ';'
#              Use '-' for none. ${VAR} is read from your shell environment at
#              registration time; a server whose variable is unset is skipped.
#              Never write a secret literally in this file.
#   command    stdio: the launch command. {{LAB}} expands to this lab's root path.
#              The engine adds the `cmd /c` wrapper on Windows automatically.
#              http: the server URL.
#
# Package names and flags for the `off` entries were current when this file was
# written; check each project's README before switching one on.

# --- Core (no API keys) ------------------------------------------------------
sequential-thinking | on  | stdio | - | npx -y @modelcontextprotocol/server-sequential-thinking
filesystem          | on  | stdio | - | npx -y @modelcontextprotocol/server-filesystem {{LAB}}/sources {{LAB}}/outputs {{LAB}}/reviews
puppeteer           | on  | stdio | - | npx -y @modelcontextprotocol/server-puppeteer

# --- Optional ----------------------------------------------------------------
# Maintained alternative to the archived Puppeteer reference server.
playwright          | off | stdio | - | npx -y @playwright/mcp@latest
# arXiv search + download (needs uv).
arxiv               | off | stdio | - | uvx arxiv-mcp-server --storage-path {{LAB}}/sources/arxiv
# Zotero, local mode: reads the running Zotero desktop app.
zotero              | off | stdio | ZOTERO_LOCAL=true | uvx zotero-mcp
# Brave web search (export BRAVE_API_KEY first).
brave-search        | off | stdio | BRAVE_API_KEY=${BRAVE_API_KEY} | npx -y @modelcontextprotocol/server-brave-search
# GitHub remote server (export GITHUB_PAT first). The header is stored in
# .mcp.json at project scope — set MCP_SCOPE=local in lab.conf if this repo is shared.
github              | off | http  | Authorization: Bearer ${GITHUB_PAT} | https://api.githubcopilot.com/mcp/
# Your own stdio server, e.g. a FastMCP script over a results database.
lab-db              | off | stdio | LAB_DB_PATH={{LAB}}/sources/lab.sqlite | python {{LAB}}/tools/lab_db_server.py
